# nginx de l'image de prod (Dockerfile) : sert le site généré (.output/public).
# Derrière Apache, qui gère le HTTPS : redirections relatives, sans port ni schéma.

# Fichiers nommés par empreinte (JS, CSS, polices, images optimisées) : cache long.
# Le reste (pages, sw.js auto-destructeur, sitemap…) : toujours revalidé.
map $uri $cache_control {
    ~^/(_nuxt|_fonts|_ipx)/  "public, max-age=31536000, immutable";
    default                  "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # /cv -> cv/index.html, sans redirection vers /cv/
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
