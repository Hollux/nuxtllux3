# hollux.fr — PRODUCTION (debianProd), relais Apache vers le conteneur (127.0.0.1:2330).
# Installer (une fois le DNS de hollux.fr et www.hollux.fr pointé sur debianProd) :
#   sudo cp deploy/apache/hollux.fr.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite hollux.fr && sudo systemctl reload apache2
#   sudo certbot --apache -d hollux.fr -d www.hollux.fr --redirect
# certbot recopie ce bloc dans hollux.fr-le-ssl.conf (vhost :443).

<VirtualHost *:80>
    ServerName hollux.fr
    ServerAlias www.hollux.fr
    ServerAdmin holluxpanda@gmail.com
    DocumentRoot /var/www/

    # Challenge ACME servi localement (pas relayé)
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/.well-known/acme-challenge/
    <Directory /var/www/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    # www.hollux.fr -> hollux.fr (adresse unique pour le référencement)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.hollux\.fr$ [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://hollux.fr%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For

    ProxyPass / http://127.0.0.1:2330/
    ProxyPassReverse / http://127.0.0.1:2330/

    ErrorLog ${APACHE_LOG_DIR}/hollux_error.log
    CustomLog ${APACHE_LOG_DIR}/hollux_access.log combined
</VirtualHost>
