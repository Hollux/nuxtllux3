# holluxdev.hollux.fr — DEV (nuxtllux3) : relais vers le serveur Nuxt (127.0.0.1:3001).
# Lancer le serveur : make dev (nuxt --hostname 127.0.0.1 --port 3001)
#
# Installer (DNS holluxdev.hollux.fr -> cette machine, déjà en place) :
#   sudo cp deploy/apache/holluxdev.hollux.fr.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
#   sudo a2ensite holluxdev.hollux.fr && sudo systemctl reload apache2
#   sudo certbot --apache -d holluxdev.hollux.fr --redirect
# certbot recopie ce bloc dans holluxdev.hollux.fr-le-ssl.conf (vhost :443).

<VirtualHost *:80>
    ServerName holluxdev.hollux.fr
    ServerAdmin holluxpanda@gmail.com
    DocumentRoot /var/www/

    # Challenge ACME servi localement (pas relayé)
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/.well-known/acme-challenge/
    <Directory /var/www/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For

    # Vite sert ses modules virtuels sur des URL contenant %2F (ex. /_nuxt/@id/virtual:nuxt:.nuxt%2Fcss.mjs) :
    # sans ces deux réglages, Apache répond 404, l'app ne s'hydrate pas et chaque clic recharge la page.
    AllowEncodedSlashes NoDecode

    # Rechargement à chaud de Vite (WebSocket)
    ProxyPass / http://127.0.0.1:3001/ upgrade=websocket nocanon
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/holluxdev_error.log
    CustomLog ${APACHE_LOG_DIR}/holluxdev_access.log combined
</VirtualHost>
